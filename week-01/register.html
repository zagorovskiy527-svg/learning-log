<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
</head>
<body>
    <a class="skip-link" href="index.html">Перейти к основному содержанию</a>
    <nav>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html" >Обо мне</a></li>
        <li><a href="index.html#skills">Навыки</a></li>
        <li><a href="index.html#contact">Контакты</a></li>
        <li><a href="gallery.html" >Галерея</a></li>
        <li><a href="register.html" aria-current="page">Регистрация</a></li>
      </ul>
    </nav>

    <form>
        <fieldset>
            <legend>Учетные данные</legend>
                <label for="login">Логин</label>
                <input type="text" id="login" name="login" required pattern="[A-Za-z0-9_]{3,20}" title="Логин должен содержать от 3 до 20 символов, включая буквы, цифры и подчеркивания." placeholder="введите логин">
                <label for="password">Пароль:</label>
                <input  type="password" 
                        id="password" 
                        name="password" 
                        required
                        minlength="8"
                        placeholder="введите пароль">
        </fieldset>

        <fieldset>
            <legend>Личные данные</legend>
                <label for="username">Имя пользователя:</label>
                <input type="text" id="username" name="username" required>
                <label for="email">Электронная почта:</label>
                <input type="email" id="email" name="email" required>
                <label for="phonenumber">Номер телефона:</label>
                <input type="tel" id="phonenumber" name="phonenumber" required pattern="[0-9]{10}" title="Введите номер телефона в формате: 1234567890">

                <label for="city">Город:</label>
                <input list="cities" id="city" name="city" required>
                <datalist id="cities">
                    <option value="Красноярск">
                    <option value="Москва">
                    <option value="Санкт-Петербург">
                    <option value="Екатеринбург">
                    <option value="Новосибирск">
                </datalist>
        </fieldset>

        <button type="submit">Зарегистрироваться</button>
    </form>
    
</body>
</html>
